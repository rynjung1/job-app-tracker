<body>
<!-- Lever's application form page, built 2026-09-15 from the structure read
     (read-only, GET only) on a public Lever posting's /apply page: the title
     in .posting-header h2, the location in .posting-categories .location, a
     form#application-form holding a hidden type=submit button, and the
     visible #btn-submit (type="button") outside it. Placeholder company,
     title, location and posting id; nothing here is a real application. -->
<div class="section page-centered posting-header">
  <h2>Staff Product Designer</h2>
  <div class="posting-categories">
    <div href="#" class="sort-by-time posting-category medium-category-label width-full capitalize-labels location">London, United Kingdom</div>
    <div href="#" class="sort-by-team posting-category medium-category-label capitalize-labels department">Design /</div>
    <div href="#" class="sort-by-commitment posting-category medium-category-label capitalize-labels commitment">Full-time /</div>
  </div>
</div>
<div class="section page-centered application-form">
  <h4>Submit your application</h4>
  <form id="application-form" enctype="multipart/form-data" method="POST">
    <ul>
      <li class="application-question"><label><div class="application-label">Full name <span class="required">✱</span></div><input type="text" name="name" required></label></li>
      <li class="application-question"><label><div class="application-label">Email <span class="required">✱</span></div><input type="email" name="email" required></label></li>
    </ul>
    <button id="hcaptchaSubmitBtn" type="submit" class="hidden">Submit</button>
  </form>
  <button id="btn-submit" type="button" class="postings-btn template-btn-submit black" data-qa="btn-submit" href="#">Submit application</button>
</div>
</body></html>
